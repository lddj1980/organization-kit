schema_version: "1.0"
integration:
  id: kimi
  name: "Kimi Code"
  version: "0.1.0"
  description: "Skills-based integration for Kimi Code CLI by Moonshot AI. Commands are installed as /org.* skills."

source: "spec-kit confirmed — .kimi-code/skills/"

requires:
  tools:
    - name: "kimi"
      required: true

provides:
  commands_dir: ".kimi-code/skills"
  file_pattern: "org.{name}.md"
  commands:
    - name: "org.init"
      file: "framework/commands/org.init.md"
    - name: "org.discover"
      file: "framework/commands/org.discover.md"
    - name: "org.spec"
      file: "framework/commands/org.spec.md"
    - name: "org.package"
      file: "framework/commands/org.package.md"
    - name: "org.invoke"
      file: "framework/commands/org.invoke.md"
    - name: "org.review"
      file: "framework/commands/org.review.md"
    - name: "org.accept"
      file: "framework/commands/org.accept.md"
    - name: "org.learn"
      file: "framework/commands/org.learn.md"
    - name: "org.status"
      file: "framework/commands/org.status.md"
    - name: "org.health"
      file: "framework/commands/org.health.md"
    - name: "org.next"
      file: "framework/commands/org.next.md"
    - name: "org.evolve"
      file: "framework/commands/org.evolve.md"

notes: |
  Kimi Code reads skills from .kimi-code/skills/ in the project root.
  Legacy path .kimi/skills/ is no longer used (migrated by --migrate-legacy in spec-kit).
  Commands appear as /org.{name} in the Kimi Code interface.
  $ARGUMENTS is populated with text typed after the command name.
