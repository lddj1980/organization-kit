schema_version: "1.0"
integration:
  id: zed
  name: "Zed"
  version: "0.1.0"
  description: "Skills for Zed editor's AI agent mode. Commands appear as /org.* in Zed AI panel."

provides:
  commands_dir: ".agents/skills"
  file_pattern: "org.{name}.md"
  commands:
    - name: "org.init"
      file: "framework/commands/org.init.md"
    - name: "org.discover"
      file: "framework/commands/org.discover.md"
    - name: "org.spec"
      file: "framework/commands/org.spec.md"
    - name: "org.package"
      file: "framework/commands/org.package.md"
    - name: "org.invoke"
      file: "framework/commands/org.invoke.md"
    - name: "org.review"
      file: "framework/commands/org.review.md"
    - name: "org.accept"
      file: "framework/commands/org.accept.md"
    - name: "org.learn"
      file: "framework/commands/org.learn.md"
    - name: "org.status"
      file: "framework/commands/org.status.md"
    - name: "org.health"
      file: "framework/commands/org.health.md"
    - name: "org.next"
      file: "framework/commands/org.next.md"
    - name: "org.evolve"
      file: "framework/commands/org.evolve.md"

notes: |
  Zed reads skills from .agents/skills/ in the project root.
  Skills are invoked as /org.{name} in the Zed AI panel.
