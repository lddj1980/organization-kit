schema_version: "1.1"
integration:
  id: openclaude
  name: "OpenClaude"
  version: "0.2.0"
  description: "Native OpenClaude skills for Organization Kit. Canonical commands are adapted into .openclaude/skills/<command>/SKILL.md."

source: "OpenClaude native skill loader (Gitlawb/openclaude): project skills in .openclaude/skills/, user skills in ~/.openclaude/skills/. Legacy .claude/commands remains supported by OpenClaude but is deprecated in its command loader."

requires:
  tools:
    - name: "openclaude"
      required: true

provides:
  skills_dir: ".openclaude/skills"
  global_dir: "~/.openclaude/skills"
  config_env: "OPENCLAUDE_CONFIG_DIR"
  file_pattern: "org.{name}/SKILL.md"
  invocation_pattern: "/org.{name}"
  command_source: "commands/org.{name}.md"
  commands:
    - name: "org.init"
      file: "commands/org.init.md"
    - name: "org.discover"
      file: "commands/org.discover.md"
    - name: "org.spec"
      file: "commands/org.spec.md"
    - name: "org.package"
      file: "commands/org.package.md"
    - name: "org.invoke"
      file: "commands/org.invoke.md"
    - name: "org.review"
      file: "commands/org.review.md"
    - name: "org.accept"
      file: "commands/org.accept.md"
    - name: "org.learn"
      file: "commands/org.learn.md"
    - name: "org.status"
      file: "commands/org.status.md"
    - name: "org.health"
      file: "commands/org.health.md"
    - name: "org.next"
      file: "commands/org.next.md"
    - name: "org.evolve"
      file: "commands/org.evolve.md"
    - name: "org.audit"
      file: "commands/org.audit.md"
    - name: "org.reconcile"
      file: "commands/org.reconcile.md"
    - name: "org.normalize"
      file: "commands/org.normalize.md"

adapter:
  strategy: "semantic-frontmatter"
  preserves:
    - "canonical markdown body"
    - "$ARGUMENTS placeholders"
    - "public /org.* command names"
  emits_frontmatter:
    - "name"
    - "description"
    - "argument-hint"
    - "user-invocable"
  drops_source_frontmatter:
    - "handoffs"
  defaults:
    user_invocable: true
    argument_hint: "[arguments]"

notes: |
  OpenClaude has a native skill registry distinct from Claude Code.
  - Project-level skills live in .openclaude/skills/<skill>/SKILL.md.
  - User-level (GLOBAL) skills live in ~/.openclaude/skills/<skill>/SKILL.md.
  - OPENCLAUDE_CONFIG_DIR overrides the user config root.
  - The directory name is intentionally "org.init", "org.spec", etc. so the
    public slash-command API remains /org.init, /org.spec, and so on.
  - Organization Kit keeps commands/ as its single canonical source. The
    OpenClaude installer converts each command into a native SKILL.md at install time.
  - OpenClaude still understands legacy .claude/commands entries, but its source
    labels that loader commands_DEPRECATED; this adapter intentionally avoids it.
