schema_version: "1.0"
integration:
  id: gemini
  name: "Gemini CLI"
  version: "0.1.0"
  description: "Command files for Google Gemini CLI. Commands appear as /org.* in Gemini CLI sessions."

provides:
  commands_dir: ".gemini/commands"
  file_pattern: "org.{name}.md"
  frontmatter_additions:
    title: true
  commands:
    - name: "org.init"
      file: "framework/commands/org.init.md"
    - name: "org.discover"
      file: "framework/commands/org.discover.md"
    - name: "org.spec"
      file: "framework/commands/org.spec.md"
    - name: "org.package"
      file: "framework/commands/org.package.md"
    - name: "org.invoke"
      file: "framework/commands/org.invoke.md"
    - name: "org.review"
      file: "framework/commands/org.review.md"
    - name: "org.accept"
      file: "framework/commands/org.accept.md"
    - name: "org.learn"
      file: "framework/commands/org.learn.md"
    - name: "org.status"
      file: "framework/commands/org.status.md"
    - name: "org.health"
      file: "framework/commands/org.health.md"
    - name: "org.next"
      file: "framework/commands/org.next.md"
    - name: "org.evolve"
      file: "framework/commands/org.evolve.md"

notes: |
  Gemini CLI reads commands from .gemini/commands/
  The frontmatter title field maps to the command display name.
